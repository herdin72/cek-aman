[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
bsc = "https://bsc-dataseed.bnbchain.org"

[fuzz]
runs = 512
